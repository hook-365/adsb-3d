name: container-lint

# Advisory only: the lint steps run continue-on-error, so a finding never
# blocks a PR or marks the job red. Findings are in the job log.

on:
  push:
    branches: [main, master]
    paths:
      - 'entrypoint.sh'
      - 'docker-healthcheck.sh'
      - 'tests/integration/run.sh'
      - 'Dockerfile'
      - 'track-service/Dockerfile'
      - 'acars-service/Dockerfile'
      - 'weather-service/Dockerfile'
      - '.github/workflows/container-lint.yml'
  pull_request:
    paths:
      - 'entrypoint.sh'
      - 'docker-healthcheck.sh'
      - 'tests/integration/run.sh'
      - 'Dockerfile'
      - 'track-service/Dockerfile'
      - 'acars-service/Dockerfile'
      - 'weather-service/Dockerfile'
      - '.github/workflows/container-lint.yml'

permissions:
  contents: read

concurrency:
  group: container-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        continue-on-error: true
        run: shellcheck entrypoint.sh docker-healthcheck.sh tests/integration/run.sh

  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - Dockerfile
          - track-service/Dockerfile
          - acars-service/Dockerfile
          - weather-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: hadolint
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
