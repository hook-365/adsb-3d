# Rate limiting zones for API protection
# This file goes in /etc/nginx/conf.d/ before server blocks
# Rate: 60r/m = 1 request per second (allows rapid aircraft selection)
# Separate zones per service so rate limits are independent
limit_req_zone $binary_remote_addr zone=track_api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=acars_api_limit:10m rate=60r/m;

# Tile proxy cache configuration
# Cache tiles for 7 days, max 500MB
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tile_cache:10m max_size=500m inactive=7d use_temp_path=off;

