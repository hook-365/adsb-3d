        add_header Cache-Control "public, max-age=2592000";
        add_header X-Tile-Source "local-cache";
        add_header Access-Control-Allow-Origin * always;
    }
    location @proxy_terrain_rgb {
        proxy_pass https://s3.amazonaws.com/elevation-tiles-prod/terrarium/$z/$x/$y.png;
        proxy_ssl_server_name on;
        proxy_cache tile_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Tile-Source "proxy-aws-terrarium";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Access-Control-Allow-Origin * always;
