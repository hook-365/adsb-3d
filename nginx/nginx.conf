    }

    # ESRI Streets tiles
    location ~ ^/tiles/esri_streets/(\d+)/(\d+)/(\d+)$ {
        set $z $1;
        set $y $2;
        set $x $3;
        root /;
        try_files /tiles/esri_streets/$z/$y/$x @proxy_esri_streets;
        default_type image/jpeg;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Tile-Source "local-cache";
        add_header Access-Control-Allow-Origin * always;
    }
    location @proxy_esri_streets {
        proxy_pass https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/$z/$y/$x;
        proxy_ssl_server_name on;
        proxy_cache tile_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Tile-Source "proxy-esri";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Access-Control-Allow-Origin * always;
    }

    # ESRI Gray Canvas tiles (minimal, clean)
    location ~ ^/tiles/esri_gray/(\d+)/(\d+)/(\d+)$ {
        set $z $1;
        set $y $2;
        set $x $3;
        root /;
        try_files /tiles/esri_gray/$z/$y/$x @proxy_esri_gray;
        default_type image/jpeg;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Tile-Source "local-cache";
        add_header Access-Control-Allow-Origin * always;
    }
    location @proxy_esri_gray {
        proxy_pass https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/$z/$y/$x;
        proxy_ssl_server_name on;
        proxy_cache tile_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Tile-Source "proxy-esri";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Access-Control-Allow-Origin * always;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
