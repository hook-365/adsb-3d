        proxy_cache_use_stale error timeout updating;
        add_header X-Tile-Source "proxy-osm-de";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Access-Control-Allow-Origin * always;
    }

    # ── FAA aeronautical charts (via vfrmap.com) ──────────────────────────
    # Free, non-commercial. The chart cycle date (${VFRMAP_CYCLE}) is
    # discovered in entrypoint.sh and substituted by envsubst at boot;
    # vfrmap rotates it every 56 days, so the container needs an occasional
    # restart to stay current. Tiles are TMS y (frontend flips before
    # sending), so the upstream y param == inbound y. US coverage only.

    # FAA Sectional (pure VFR sectional)
    location ~ ^/tiles/sectional/(\d+)/(\d+)/(\d+)$ {
        set $z $1;
        set $y $2;
        set $x $3;
        root /;
        try_files /tiles/sectional/$z/$y/$x @proxy_sectional;
        default_type image/jpeg;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Tile-Source "local-cache";
        add_header Access-Control-Allow-Origin * always;
    }
    location @proxy_sectional {
        proxy_pass https://vfrmap.com/${VFRMAP_CYCLE}/tiles/sectc/$z/$y/$x.jpg;
        proxy_ssl_server_name on;
        proxy_set_header User-Agent "adsb-3d/1.0";
        proxy_cache tile_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Tile-Source "proxy-vfrmap";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Access-Control-Allow-Origin * always;
    }

    # FAA Sectional + OSM roads overlay (vfrmap's "Hybrid VFR")
    location ~ ^/tiles/sectional_hybrid/(\d+)/(\d+)/(\d+)$ {
        set $z $1;
        set $y $2;
        set $x $3;
        root /;
