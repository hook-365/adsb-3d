        set $y $2;
        set $x $3;
        root /;
        try_files /tiles/hillshade/$z/$y/$x @proxy_hillshade;
        default_type image/jpeg;  # ESRI returns JPEG
        add_header Cache-Control "public, max-age=604800";
        add_header X-Tile-Source "local-cache";
        add_header Access-Control-Allow-Origin * always;
    }
    location @proxy_hillshade {
        proxy_pass https://services.arcgisonline.com/arcgis/rest/services/World_Shaded_Relief/MapServer/tile/$z/$y/$x;
        proxy_ssl_server_name on;
        proxy_cache tile_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Tile-Source "proxy-esri";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Access-Control-Allow-Origin * always;
    }

    # Topo tiles (OpenTopoMap)
    location ~ ^/tiles/topo/(\d+)/(\d+)/(\d+)$ {
