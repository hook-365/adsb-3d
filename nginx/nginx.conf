        add_header Cache-Control "public, max-age=604800";
        add_header X-Tile-Source "local-cache";
        add_header Access-Control-Allow-Origin * always;
    }
    location @proxy_osm {
        proxy_pass https://a.tile.openstreetmap.org/$z/$x/$y.png;
        proxy_ssl_server_name on;
        proxy_set_header User-Agent "adsb-3d/1.0";
        proxy_cache tile_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Tile-Source "proxy-osm";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Access-Control-Allow-Origin * always;
    }

    # Terrain elevation tiles (AWS Open Data terrarium — elevation encoded
    # in RGB, not imagery). Effectively immutable upstream, so cache long.
    location ~ ^/tiles/terrain_rgb/(\d+)/(\d+)/(\d+)$ {
        set $z $1;
        set $y $2;
        set $x $3;
        root /;
        try_files /tiles/terrain_rgb/$z/$y/$x @proxy_terrain_rgb;
