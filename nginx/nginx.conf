# DNS resolver for dynamic upstream resolution
# Use Docker's internal DNS (127.0.0.11) to resolve service names
# ipv6=off forces IPv4 resolution only (some containers can't reach IPv6)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;

        # Prevent aggressive caching of HTML, JS, and CSS files
        location ~* \.(html|js|css)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # Proxy aircraft data from feeder (ultrafeeder, readsb, tar1090, etc.)
    # Default/local feed
    location /data/ {
        # envsubst replaces these at container startup
        # Works with: ultrafeeder, ultrafeeder:8080, skymon.ruskowski.de/tar1090
        proxy_pass http://${FEEDER_HOST}/data/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host ${FEEDER_HOSTNAME};
        proxy_cache_bypass $http_upgrade;

        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept';
    }

    # ==========================================================================
    # Dynamic Remote Feed Data Proxies
    # Auto-generated by entrypoint.sh from FEEDS_CONFIG
    # For each remote feed (index N in FEEDS_CONFIG, N > 0):
    #   - Uses FEED{N+1}_DATA_HOST environment variable
    #   - Path prefix extracted from feed's liveUrl
    # ==========================================================================
    ### DYNAMIC_FEED_DATA_BLOCKS ###

    # Serve local sprites.png (tar1090 aircraft icons)
    location = /images/sprites.png {
        alias /usr/share/nginx/html/images/sprites.png;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin * always;
    }

    # Proxy aircraft images from airport-data.com (legacy, keep for compatibility)
    location /images/ {
        proxy_pass https://airport-data.com/images/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host airport-data.com;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; adsb-3d)";

        # Hide upstream headers
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;

        # Add our own CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;

        # Cache images for 24 hours
        proxy_cache_valid 200 24h;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Proxy planespotters.net photos (primary photo source)
    location /photos/ {
        proxy_pass https://t.plnspttrs.net/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host t.plnspttrs.net;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; adsb-3d)";
        proxy_set_header Referer "https://www.planespotters.net/";

        # Hide upstream headers
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;

        # Add our own CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;

        # Cache images for 7 days (they don't change)
        proxy_cache tile_cache;
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Proxy Track API endpoints - Local (for historical mode)
    # Only active if TRACK_API_HOST is configured
    location /api/ {
        # Rate limiting: 60 requests/min with burst of 20 (allows rapid aircraft selection)
        limit_req zone=track_api_limit burst=20 nodelay;
        limit_req_status 429;

        # Query complexity limits - block excessive queries
        # Block max_tracks > 10000 (allow up to 10000)
        set $block_query 0;

        # Check if max_tracks is > 10000 (5+ digits starting with 1-9, or 10001+)
        # Allow: 1-9999 (1-4 digits), 10000 (exactly)
        # Block: 10001+ (5 digits > 10000, or 6+ digits)
        if ($arg_max_tracks ~ "^(1000[1-9]|10[1-9][0-9]{2}|1[1-9][0-9]{3}|[2-9][0-9]{4}|[0-9]{6,})$") {
            set $block_query 1;  # Greater than 10000
        }

        if ($block_query = 1) {
            return 413;  # Payload Too Large
        }

        # Timeouts to prevent expensive long-running queries
        # Increased from 30s to handle larger datasets
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 15s;

        # Add custom headers for debugging
        add_header X-RateLimit-Limit "60/min" always;
        add_header X-RateLimit-Burst "20" always;

        # Use variable to enable dynamic DNS resolution (no startup dependency)
        # Strip /api prefix and pass to track-service
        set $track_api_upstream ${TRACK_API_HOST};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$track_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept';

        # Health check endpoint passthrough
        location /api/health {
            set $track_api_upstream ${TRACK_API_HOST};
            proxy_pass http://$track_api_upstream/health;
        }
    }

    # WebSocket live diff stream (track-service /ws/live).
    # Separate from /api/ because we need a long read timeout and no
    # request-rate limiting on a persistent connection.
    location /ws/ {
        set $track_api_upstream ${TRACK_API_HOST};
        proxy_pass http://$track_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Keep the socket open for hours; the broadcast loop is the keepalive.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ==========================================================================
    # Dynamic Remote Feed API Proxies
    # Auto-generated by entrypoint.sh from FEEDS_CONFIG
    # For each remote feed (index N in FEEDS_CONFIG, N > 0):
    #   - Uses FEED{N+1}_API_HOST environment variable
    #   - Path prefix extracted from feed's apiBase
    # ==========================================================================
    ### DYNAMIC_FEED_API_BLOCKS ###

    # Proxy ACARS API endpoints (for ACARS integration)
    # Only active if ACARS_API_HOST is configured
    # ==========================================================================
    # Voice services (VHF AM scanner): call index + events WebSocket
    # ==========================================================================
    # /voice/calls         → voice-events sidecar: call index + per-call audio
    # /voice/ws            → voice-events sidecar: new-call + activity push
    # /voice/scanner.mp3   → legacy Icecast mixed stream (compat only — the
    #                        call-based frontend no longer plays it)
    #
    # Proxying through nginx keeps the browser on a single origin (no CORS,
    # works behind NPMPlus when published, plays nicely with HTTPS later).
    location /voice/scanner.mp3 {
        set $voice_stream_upstream ${VOICE_STREAM_HOST};
        proxy_pass http://$voice_stream_upstream/scanner.mp3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /voice/ws {
        set $voice_events_upstream ${VOICE_EVENTS_HOST};
        # Strip the /voice prefix — the events service serves the socket at /ws.
        rewrite ^/voice/ws$ /ws break;
        proxy_pass http://$voice_events_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Call index API + per-call audio (call-based scanner).
    #   /voice/calls              → recent transmissions as JSON
    #   /voice/calls/<id>/audio   → that call's MP3 (Range-capable)
    location /voice/calls {
        set $voice_events_upstream ${VOICE_EVENTS_HOST};
        rewrite ^/voice/(.*)$ /$1 break;
        proxy_pass http://$voice_events_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Access-Control-Allow-Origin * always;
    }

    location /acars-api/ {
        # Rate limiting: 60 requests/min with burst of 30 (allows rapid aircraft selection)
        limit_req zone=acars_api_limit burst=30 nodelay;
        limit_req_status 429;

        # Timeouts
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;

        # Use variable to enable dynamic DNS resolution (no startup dependency)
        # Strip /acars-api prefix and pass to acars-service
        set $acars_api_upstream ${ACARS_API_HOST};
        rewrite ^/acars-api/(.*)$ /$1 break;
        proxy_pass http://$acars_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept';

        # Health check endpoint passthrough
        location /acars-api/health {
            set $acars_api_upstream ${ACARS_API_HOST};
            proxy_pass http://$acars_api_upstream/health;
        }
    }

    # ==========================================================================
    # Map Tile Serving - Local cache with external fallback
    # Each provider has its own location block with try_files -> proxy fallback
    # ==========================================================================

    # Dark tiles (Carto)
    location ~ ^/tiles/dark/(\d+)/(\d+)/(\d+)$ {
        set $z $1;
        set $y $2;
        set $x $3;

        # Try local cache first, then proxy
        root /;
        try_files /tiles/dark/$z/$y/$x @proxy_dark;

        # Tiles have no extension - set MIME type
        default_type image/png;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Tile-Source "local-cache";
        add_header Access-Control-Allow-Origin * always;
    }
    location @proxy_dark {
        proxy_pass https://a.basemaps.cartocdn.com/dark_all/$z/$x/$y.png;
        proxy_ssl_server_name on;
        proxy_cache tile_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Tile-Source "proxy-carto";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Access-Control-Allow-Origin * always;
    }

    # Carto Voyager tiles
    location ~ ^/tiles/carto_voyager/(\d+)/(\d+)/(\d+)$ {
        set $z $1;
        set $y $2;
        set $x $3;
        root /;
        try_files /tiles/carto_voyager/$z/$y/$x @proxy_voyager;
        default_type image/png;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Tile-Source "local-cache";
        add_header Access-Control-Allow-Origin * always;
    }
    location @proxy_voyager {
        proxy_pass https://a.basemaps.cartocdn.com/rastertiles/voyager/$z/$x/$y.png;
        proxy_ssl_server_name on;
        proxy_cache tile_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Tile-Source "proxy-carto";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Access-Control-Allow-Origin * always;
    }

    # Hillshade/Shaded Relief tiles (ESRI)
    location ~ ^/tiles/hillshade/(\d+)/(\d+)/(\d+)$ {
