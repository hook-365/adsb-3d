# Baseline security headers, included from the server block and from every
# location that defines its own add_header (nginx's add_header inheritance
# is all-or-nothing per level — a location with any add_header of its own
# loses the server-level set unless it re-includes this file).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
