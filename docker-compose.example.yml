# ADS-B 3D Viewer - Deployment Example
#
# Three ways to run this:
#
#   1. Single station, live-only           → use the adsb-3d service as-is
#   2. Single station, with history        → also enable track-service + timescaledb-adsb
#   3. Multi-feed (network of receivers)   → add FEED2_*, FEED3_*, ... blocks
#
# Adding a new remote feed = 4 env vars (NAME, URL, LAT, LON). The entrypoint
# wires up nginx proxies, the frontend feed switcher, and FEED_MODE for you.

services:
  adsb-3d:
    image: ghcr.io/hook-365/adsb-3d:latest
    container_name: adsb-3d
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    # Loads vars from a .env file next to this compose file (see
    # .env.example) — e.g. DB_PASSWORD, CORS_ALLOW_ORIGIN, FEEDN_* if you'd
    # rather keep them out of this file. The inline `environment:` block
    # below takes precedence over anything the same name sets here.
    # required: false so `docker compose config` still works before you've
    # created a .env — copy .env.example to .env to actually use it.
    env_file:
      - path: .env
        required: false
    environment:
      # ── Local station ────────────────────────────────────────────────
      - LATITUDE=45.0000
      - LONGITUDE=-90.0000
      - ALTITUDE=1000
      - LOCATION_NAME=My Station
      - FEEDER_URL=http://ultrafeeder
      # Contact (email or site) sent to adsb.im in the User-Agent of route
      # lookups and to tile providers — they ask for one. Nothing is sent
      # if unset (the container warns at start). Same variable on track-service.
      - ROUTE_API_CONTACT=you@example.com

      # ── Optional features ────────────────────────────────────────────
      - ENABLE_HISTORICAL=false       # true to enable historical playback
      - ENABLE_ACARS=false            # true to enable ACARS (needs acars-service)
      - ENABLE_WEATHER3D=false        # true for 3D storms (needs weather-service, US only)
      - HIDE_TOWER=false              # true to hide home tower (privacy)
      # ── Global Explore (pick any city via a community aggregator) ─────
      # One provider per deployment; all four answer in readsb format. Feed
      # them from your receiver if you can: they run on hobbyist data.
      # - EXPLORE_PROVIDER=flyitalyadsb   # needs EXPLORE_API_KEY (free, instant);
      # - EXPLORE_API_KEY=fia_xxx         # feeders get Pro limits; data CC BY-SA 4.0
      # - EXPLORE_PROVIDER=adsb.lol       # no key; data ODbL 1.0
      # - EXPLORE_PROVIDER=adsb.fi        # no key; personal, non-commercial; 1 req/s
      # - EXPLORE_PROVIDER=airplanes.live # no key; non-commercial terms
      # - EXPLORE_POLL_S=10               # poll cadence = per-city cache window
      # - CARTO_API_KEY=your-key      # free key from carto.com/basemaps/apikey unlocks
      #                               # the Carto Dark/Voyager basemaps (browser-direct,
      #                               # one key per deployment, never share it)
      # - ENABLE_TERRAIN=true         # deploy-level 3D-terrain kill switch;
      #                               # false hides the per-user terrain toggle entirely
      # - ENABLE_UPDATE_CHECK=true    # container checks GitHub daily for a newer release
      #                               # and the settings panel shows a badge; false = off
      # - DNS_RESOLVER=10.96.0.10     # nginx upstream DNS; default is Docker's
      #                               # embedded 127.0.0.11 — override on runtimes
      #                               # without it (e.g. Kubernetes CoreDNS)

      # ── Voice scanner (opt-in, requires a voice-services stack) ──────
      # When ENABLE_VOICE=true the frontend renders a call-feed Voice panel
      # (one clip per transmission) and nginx proxies /voice/calls + /voice/ws
      # to the voice-events sidecar. Stand up rtl_airband + Icecast + the
      # voice-events sidecar yourself (see docs/VOICE.md); leave disabled if
      # you don't run that stack.
      # - ENABLE_VOICE=false
      # - VOICE_EVENTS_HOST=voice-events:8001    # sidecar — /voice/calls + /voice/ws
      # - VOICE_STREAM_HOST=voice-icecast:8000   # Icecast host (nginx compat only;
      #                                          # the frontend plays calls, not the stream)

      # ── Multi-feed (uncomment to enable feed switching) ──────────────
      # One block per remote receiver. Slot 1 is THIS station (local) — its
      # LAT/LON/NAME override the values above when set. Slots 2+ are remote
      # adsb-3d instances reachable over HTTP; FEED{N}_URL is just host:port.
      #
      # - FEED1_NAME=Home Station
      # - FEED1_LAT=45.0000          # overrides LATITUDE above when set
      # - FEED1_LON=-90.0000
      # - FEED1_ALT=1000
      #
      # - FEED2_NAME=Remote Site A
      # - FEED2_URL=192.0.2.10:8086
      # - FEED2_LAT=43.0000
      # - FEED2_LON=-89.0000
      # - FEED2_COLOR=#ff8c4c        # optional badge color
      # - FEED2_ACARS=true           # optional, enable ACARS for this feed
      #
      # - FEED3_NAME=Remote Site B
      # - FEED3_URL=192.0.2.20:8086
      # - FEED3_LAT=43.0000
      # - FEED3_LON=-87.0000
    ports:
      - "8086:80"
    # Uncomment to persist the map tile cache across restarts and enable
    # boot-time tile pre-caching around your station (see MAP_ZOOM /
    # MAP_GRID_SIZE in .env.example). Without this volume, tiles are only
    # cached in the container's nginx proxy cache for the container's
    # lifetime.
    # volumes:
    #   - adsb-3d-tiles:/tiles
    # Uncomment for historical mode:
    # depends_on:
    #   - track-service

  # ── Historical mode (uncomment to enable) ──────────────────────────────
  # The DB password below uses ${DB_PASSWORD} — set it ONCE in a .env file
  # next to this compose file (see .env.example). Docker Compose substitutes
  # it into all three DB services, so the credential can never drift.
  # track-service:
  #   image: ghcr.io/hook-365/adsb-track-service:latest
  #   container_name: track-service
  #   restart: unless-stopped
  #   environment:
  #     - FEEDER_URL=http://ultrafeeder
  #     - DB_HOST=timescaledb-adsb
  #     # Shown to adsb.im in the User-Agent of shared route lookups (they ask for a contact)
  #     - ROUTE_API_CONTACT=you@example.com
  #     # - ROUTE_CACHE_TTL_SECONDS=86400   # shared route cache lifetime (default 24 h)
  #     # - ROUTE_MIN_INTERVAL_SECONDS=180  # floor between adsb.im requests (default 3 min)
  #     - DB_PORT=5432
  #     - DB_NAME=adsb_tracks
  #     - DB_USER=adsb
  #     - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in your .env file}
  #     - COLLECTION_INTERVAL=5
  #   ports:
  #     - "8087:8000"
  #   depends_on:
  #     - timescaledb-adsb

  # timescaledb-adsb:
  #   image: timescale/timescaledb:2.17.2-pg16
  #   container_name: timescaledb-adsb
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_DB=adsb_tracks
  #     - POSTGRES_USER=adsb
  #     - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in your .env file}
  #   volumes:
  #     - timescaledb-data:/var/lib/postgresql/data
  #   ports:
  #     - "5433:5432"

  # ── ACARS service (uncomment to enable) ────────────────────────────────────
  # Requires an external acarshub stack (or acarsdec) feeding TCP port 15550.
  # Run that stack yourself; this service connects to it by hostname/IP.
  # Also set ENABLE_ACARS=true on the adsb-3d service above.
  # acars-service:
  #   image: ghcr.io/hook-365/adsb-acars-service:latest
  #   container_name: acars-service
  #   restart: unless-stopped
  #   environment:
  #     - ACARS_HOST=acarshub       # hostname or IP of your acarshub/acarsdec
  #     - ACARS_PORT=15550
  #     - STATION_ID=MY_STATION
  #     - DB_HOST=timescaledb-adsb
  #     - DB_PORT=5432
  #     - DB_NAME=adsb_tracks
  #     - DB_USER=adsb
  #     - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in your .env file}
  #   depends_on:
  #     - timescaledb-adsb

  # ── Weather service (uncomment to enable 3D storms) ─────────────────────
  # Downloads NOAA MRMS 3D reflectivity (keyless, public domain, US coverage
  # only) every 5 minutes and serves a small volume cropped around whichever
  # feed the viewer has active; one service covers every feed. No database.
  # Also set ENABLE_WEATHER3D=true on adsb-3d above.
  # weather-service:
  #   image: ghcr.io/hook-365/adsb-weather-service:latest
  #   container_name: weather-service
  #   restart: unless-stopped
  #   environment:
  #     - LATITUDE=45.0000          # optional: pre-warm the local feed's volume
  #     - LONGITUDE=-90.0000        # (same values as the adsb-3d service)
  #     - ROUTE_API_CONTACT=you@example.com
  #     # - WEATHER3D_RADIUS_NM=250   # half-width of each crop box (nautical miles)
  #     # - WEATHER3D_LOCATION_TTL_S=1800  # drop idle feed locations after this
  #     # - WEATHER_FIELDS=echotop18,echotop30,freezing,preciprate,preciptype,mesh,rotation,lightning
  #     #                                  # 2-D products (echo tops, precip, 0 °C, hail/rotation, lightning)

# Uncomment whichever of these you enabled above (historical mode's DB
# volume, and/or the adsb-3d tiles cache volume) — both live under one
# top-level `volumes:` key.
# volumes:
#   timescaledb-data:
#   adsb-3d-tiles:
